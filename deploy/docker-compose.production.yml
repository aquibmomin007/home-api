services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/${HOME_API_IMAGE_NAME:-home-api}:${HOME_API_IMAGE_TAG:-latest}
    container_name: home-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
